name: Tool Expert Super Configurator

on:
  push:
    paths:
      - "apps/tool_expert_factory/**"
      - "docs/AUREA-TOOL-AUTOMATION-*.md"
      - ".github/workflows/tool-expert-super-configurator.yml"
  pull_request:
    paths:
      - "apps/tool_expert_factory/**"
      - "docs/AUREA-TOOL-AUTOMATION-*.md"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q apps/tool_expert_factory/test_super_configurator.py
      - run: python -m apps.tool_expert_factory.super_configurator plan

  live-install-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run real sequential configuration
        run: python -m apps.tool_expert_factory.super_agent --apply
      - name: Upload configuration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-expert-super-configurator-audit
          path: runtime/tool-expert-super-configurator/
          if-no-files-found: warn
