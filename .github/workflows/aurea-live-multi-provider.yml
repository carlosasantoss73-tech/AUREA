name: AUREA Live Multi-Provider Execution Gate

on:
  pull_request:
    paths:
      - ".github/workflows/aurea-live-multi-provider.yml"
      - "apps/tool_expert_factory/provider_execution.py"
      - "apps/tool_expert_factory/test_provider_execution.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/aurea-live-multi-provider.yml"
      - "apps/tool_expert_factory/provider_execution.py"
      - "apps/tool_expert_factory/test_provider_execution.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-multi-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify credentials are present without exposing them
        run: |
          test -n "$GEMINI_API_KEY" || { echo "BLOCKED:MISSING_GEMINI_API_KEY"; exit 20; }
          test -n "$ANTHROPIC_API_KEY" || { echo "BLOCKED:MISSING_ANTHROPIC_API_KEY"; exit 21; }

      - name: Execute Gemini real provider
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key=os.environ["GEMINI_API_KEY"]
          url="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
          payload={"contents":[{"parts":[{"text":"AUREA live provider probe. Reply only: PROVIDER_GEMINI_OK"}]}]}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=60) as resp:
                  body=json.load(resp)
                  status=resp.status
          except Exception as exc:
              print(json.dumps({"provider":"gemini","status":"FAILED","error_type":type(exc).__name__},ensure_ascii=False))
              raise
          text=""
          for c in body.get("candidates",[]):
              for p in c.get("content",{}).get("parts",[]):
                  if isinstance(p,dict): text += str(p.get("text",""))
          if not text.strip():
              raise SystemExit("GEMINI_EMPTY_RESPONSE")
          print(json.dumps({"provider":"gemini","model":"gemini-3.8-flash","http_status":status,"evidence":"NON_EMPTY_RESPONSE"},ensure_ascii=False))
          PY

      - name: Execute Claude real provider
        run: |
          python - <<'PY'
          import json, os, urllib.request
          key=os.environ["ANTHROPIC_API_KEY"]
          url="https://api.anthropic.com/v1/messages"
          payload={"model":"claude-opus-5-5","max_tokens":64,"messages":[{"role":"user","content":"AUREA live provider probe. Reply only: PROVIDER_CLAUDE_OK"}]}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=60) as resp:
                  body=json.load(resp)
                  status=resp.status
          except Exception as exc:
              print(json.dumps({"provider":"claude","status":"FAILED","error_type":type(exc).__name__},ensure_ascii=False))
              raise
          text=""
          for block in body.get("content",[]):
              if isinstance(block,dict): text += str(block.get("text",""))
          if not text.strip():
              raise SystemExit("CLAUDE_EMPTY_RESPONSE")
          print(json.dumps({"provider":"claude","model":"claude-opus-5-5","http_status":status,"evidence":"NON_EMPTY_RESPONSE"},ensure_ascii=False))
          PY

      - name: Run provider fallback contract tests
        run: |
          python -m pip install pytest
          python -m pytest -q apps/tool_expert_factory/test_provider_execution.py

      - name: Emit gate evidence
        run: |
          echo "RESULTADO: LIVE_MULTI_PROVIDER_EXECUTION_PASS"
          echo "EVIDENCIA: Gemini real response + Claude real response + provider contract tests"
          echo "DECISION: multi-provider LIVE demonstrated; fallback LIVE remains unproven until a real first-provider failure is captured"
