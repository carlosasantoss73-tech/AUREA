name: ECP Cloudflare Pilot Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm deployment of the ECP pilot Worker"
        type: boolean
        required: true
        default: false
      access_team_domain:
        description: "Required Cloudflare Access team name (without .cloudflareaccess.com)"
        type: string
        required: false
      access_audience:
        description: "Required Access application AUD tag"
        type: string
        required: false
      institutional_index_file_id:
        description: "Verified current institutional index file ID; blank keeps the placeholder and blocks analysis"
        type: string
        required: false
      anthropic_model:
        description: "Active Anthropic model ID available to this account"
        type: string
        required: false
        default: "claude-sonnet-5"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Require Access protection configuration
        env:
          ECP_ACCESS_TEAM_DOMAIN: ${{ inputs.access_team_domain }}
          ECP_ACCESS_AUD: ${{ inputs.access_audience }}
        run: |
          test -n "$ECP_ACCESS_TEAM_DOMAIN" || { echo "::error::Cloudflare Access team domain is required; refusing an unprotected bootstrap deploy."; exit 1; }
          test -n "$ECP_ACCESS_AUD" || { echo "::error::Cloudflare Access AUD is required; refusing an unprotected bootstrap deploy."; exit 1; }
      - name: Apply supplied non-secret pilot configuration
        env:
          ECP_ACCESS_TEAM_DOMAIN: ${{ inputs.access_team_domain }}
          ECP_ACCESS_AUD: ${{ inputs.access_audience }}
          ECP_INSTITUTIONAL_INDEX_FILE_ID: ${{ inputs.institutional_index_file_id }}
          ECP_ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "wrangler.ecp.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const pairs = [
            ["ECP_ACCESS_TEAM_DOMAIN", process.env.ECP_ACCESS_TEAM_DOMAIN],
            ["ECP_ACCESS_AUD", process.env.ECP_ACCESS_AUD],
            ["ECP_INSTITUTIONAL_INDEX_FILE_ID", process.env.ECP_INSTITUTIONAL_INDEX_FILE_ID],
            ["ECP_ANTHROPIC_MODEL", process.env.ECP_ANTHROPIC_MODEL],
          ];
          for (const [key, value] of pairs) {
            if (typeof value === "string" && value.trim()) config.vars[key] = value.trim();
          }
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE
      - name: Install dependencies
        run: npm install
      - name: Deploy ECP Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.ecp.jsonc
      - name: Set available provider and institutional secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ECP_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.ECP_GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler secret put ANTHROPIC_API_KEY --config wrangler.ecp.jsonc
          else
            echo "::warning::ANTHROPIC_API_KEY is not configured; analysis will remain blocked."
          fi
          if [ -n "$ECP_GOOGLE_DRIVE_ACCESS_TOKEN" ]; then
            printf '%s' "$ECP_GOOGLE_DRIVE_ACCESS_TOKEN" | npx --yes wrangler secret put ECP_GOOGLE_DRIVE_ACCESS_TOKEN --config wrangler.ecp.jsonc
          else
            echo "::warning::ECP_GOOGLE_DRIVE_ACCESS_TOKEN is not configured; institutional retrieval and analysis will remain blocked."
          fi
