name: ECP Institutional Drive Write Preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required configuration
        env:
          WIF_PROVIDER: ${{ vars.AUREA_GCP_WIF_PROVIDER || secrets.AUREA_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT || secrets.AUREA_GCP_SERVICE_ACCOUNT }}
          AGENTS_FOLDER_ID: ${{ vars.AUREA_ECP_AGENTS_FOLDER_ID }}
          ACTAS_FOLDER_ID: ${{ vars.AUREA_CONTROL_ACTAS_FOLDER_ID }}
          INDEX_FILE_ID: ${{ vars.AUREA_KNOWLEDGE_OS_INDEX_ID }}
        run: |
          set -euo pipefail
          for key in WIF_PROVIDER SERVICE_ACCOUNT AGENTS_FOLDER_ID ACTAS_FOLDER_ID INDEX_FILE_ID; do
            if [ -z "${!key:-}" ]; then
              echo "PREFLIGHT_BLOCKED: missing configuration: $key"
              exit 1
            fi
          done
          printf '%s' "$WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'
          printf '%s' "$SERVICE_ACCOUNT" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.iam\.gserviceaccount\.com$'
          echo "Configuration names and formats validated; no secret values printed."

      - name: Authenticate through Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AUREA_GCP_WIF_PROVIDER || secrets.AUREA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT || secrets.AUREA_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.metadata.readonly

      - name: Install Google API client
        run: python -m pip install --quiet google-api-python-client google-auth

      - name: Verify folder capabilities, ACL inheritance, and index protection
        env:
          SERVICE_ACCOUNT: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT || secrets.AUREA_GCP_SERVICE_ACCOUNT }}
          AGENTS_FOLDER_ID: ${{ vars.AUREA_ECP_AGENTS_FOLDER_ID }}
          ACTAS_FOLDER_ID: ${{ vars.AUREA_CONTROL_ACTAS_FOLDER_ID }}
          INDEX_FILE_ID: ${{ vars.AUREA_KNOWLEDGE_OS_INDEX_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from googleapiclient.discovery import build

          drive = build("drive", "v3")

          def metadata(file_id):
              return drive.files().get(
                  fileId=file_id,
                  fields="id,name,mimeType,parents,capabilities(canAddChildren,canEdit,canDownload)",
                  supportsAllDrives=True,
              ).execute()

          def permissions(file_id):
              result = drive.permissions().list(
                  fileId=file_id,
                  fields="permissions(id,type,emailAddress,domain,role,permissionDetails(inherited,inheritedFrom,role,permissionType))",
                  supportsAllDrives=True,
                  supportsTeamDrives=True,
              ).execute()
              return result.get("permissions", [])

          target_ids = [os.environ["AGENTS_FOLDER_ID"], os.environ["ACTAS_FOLDER_ID"], os.environ["INDEX_FILE_ID"]]
          if len(set(target_ids)) != len(target_ids):
              raise SystemExit("PREFLIGHT_BLOCKED: folder and index IDs must be distinct")

          principal = os.environ["SERVICE_ACCOUNT"].lower()
          folders = [
              ("03_AGENTES", os.environ["AGENTS_FOLDER_ID"]),
              ("00_CONTROL/ACTAS", os.environ["ACTAS_FOLDER_ID"]),
          ]

          for label, file_id in folders:
              item = metadata(file_id)
              if item.get("id") != file_id:
                  raise SystemExit(f"PREFLIGHT_BLOCKED: returned Drive ID mismatch for {label}")
              if item.get("mimeType") != "application/vnd.google-apps.folder":
                  raise SystemExit(f"PREFLIGHT_BLOCKED: {label} is not a Drive folder")
              caps = item.get("capabilities", {})
              if caps.get("canAddChildren") is not True or caps.get("canEdit") is not True:
                  raise SystemExit(f"PREFLIGHT_BLOCKED: required folder capabilities absent for {label}")

              acl = permissions(file_id)
              # Log ACL structure without printing permission IDs or unrelated email addresses.
              summary = [{
                  "type": p.get("type"),
                  "principal_matches_service_account": p.get("type") == "user" and (p.get("emailAddress") or "").lower() == principal,
                  "role": p.get("role"),
                  "permissionDetails": p.get("permissionDetails", []),
              } for p in acl]
              print(json.dumps({"target": label, "folder_id": file_id, "capabilities": caps, "acl_summary": summary}, ensure_ascii=False))

              direct_writer = any(
                  p.get("type") == "user"
                  and (p.get("emailAddress") or "").lower() == principal
                  and p.get("role") in ("writer", "fileOrganizer", "organizer")
                  and not any(detail.get("inherited") for detail in p.get("permissionDetails", []))
                  for p in acl
              )
              # Conservative: any inherited write-capable role can widen access through a group/domain.
              write_roles = ("owner", "writer", "fileOrganizer", "organizer")
              unexpected_writer = any(
                  p.get("role") in write_roles
                  and not (
                      p.get("type") == "user"
                      and (p.get("emailAddress") or "").lower() == principal
                      and p.get("role") in ("writer", "fileOrganizer", "organizer")
                      and not any(detail.get("inherited") for detail in p.get("permissionDetails", []))
                  )
                  for p in acl
              )
              if not direct_writer:
                  raise SystemExit(f"PREFLIGHT_BLOCKED: no direct write grant for configured service account on {label}; grant must be explicit on the target folder")
              if unexpected_writer:
                  raise SystemExit(f"PREFLIGHT_BLOCKED: another direct, inherited, group, domain, or owner write-capable permission is present on {label}; least privilege is not demonstrated")

          index = metadata(os.environ["INDEX_FILE_ID"])
          if index.get("id") != os.environ["INDEX_FILE_ID"]:
              raise SystemExit("PREFLIGHT_BLOCKED: returned Drive ID mismatch for index")
          print(json.dumps({
              "protected_index": {
                  "id": index.get("id"),
                  "name": index.get("name"),
                  "mimeType": index.get("mimeType"),
                  "canEdit": index.get("capabilities", {}).get("canEdit"),
              }
          }, ensure_ascii=False))
          if index.get("name") != "INDICE_MAESTRO_v011.json":
              raise SystemExit("PREFLIGHT_BLOCKED: configured ID is not INDICE_MAESTRO_v011.json")
          if index.get("mimeType") != "application/json":
              raise SystemExit("PREFLIGHT_BLOCKED: protected index is not application/json")
          if index.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("PREFLIGHT_BLOCKED: read-only capability for v011 is not demonstrated")
          print("PREFLIGHT_PASS: explicit folder write grants and index protection verified; no Drive files created or modified.")
          PY
