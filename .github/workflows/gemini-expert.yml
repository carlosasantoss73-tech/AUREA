name: AUREA Gemini Expert Pilot

on:
  push:
    paths:
      - "apps/gemini-expert/**"
      - "docs/AUREA-GEMINI-EXPERT-KNOWLEDGE-PACK-V2.md"
      - ".github/workflows/gemini-expert.yml"
  pull_request:
    paths:
      - "apps/gemini-expert/**"
      - "docs/AUREA-GEMINI-EXPERT-KNOWLEDGE-PACK-V2.yml"
      - ".github/workflows/gemini-expert.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gemini-expert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run fail-closed contract tests
        run: python -m pytest -q

  live-probe:
    if: ${{ github.event_name == 'push' && vars.AUREA_ENABLE_GEMINI_LIVE_PROBE == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gemini-expert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: python -m pip install -r requirements.txt
      - name: Live Gemini probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          python -m cli "Run a read-only connectivity probe. State the current model identity and return a concise RESULTADO/EVIDENCIA/DECISIÓN/APRENDIZAJE/ADAPTACIÓN/SIGUIENTE ACCIÓN record. Do not mutate anything."
