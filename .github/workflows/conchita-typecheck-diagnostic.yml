name: Conchita Typecheck Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture typecheck output
        run: npm run typecheck > typecheck.log 2>&1 || true
      - name: Upload typecheck output
        uses: actions/upload-artifact@v7
        with:
          name: conchita-typecheck-log
          path: typecheck.log
          archive: false
