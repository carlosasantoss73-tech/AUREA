name: AUREA P0

on:
  push:
    branches: [main, p0-functionalization, b13-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aurea-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
