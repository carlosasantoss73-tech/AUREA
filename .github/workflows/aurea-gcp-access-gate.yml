name: AUREA GCP Access Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AUREA_KNOWLEDGE_OS_ROOT_ID: 1LII_NQoow-zcR_iGECRiA6cVS4VOBXLm
  AUREA_KNOWLEDGE_OS_INDEX_ID: 1kIzswJSMKzQOpf8z6j8iDvfxhq26ZvXa

jobs:
  gcp-access-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report configured GCP federation inputs
        env:
          WIF_PROVIDER: ${{ vars.AUREA_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "=== AUREA GCP ACCESS GATE ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "OIDC permission: id-token=write"
          if [ -n "$WIF_PROVIDER" ]; then echo "WIF provider variable: PRESENT"; else echo "WIF provider variable: MISSING"; fi
          if [ -n "$SERVICE_ACCOUNT" ]; then echo "Service account variable: PRESENT"; else echo "Service account variable: MISSING"; fi

      - name: Fail closed when WIF federation is not configured
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER == '' }}
        run: |
          set -euo pipefail
          echo "GCP_CONTROL_PLANE_NOT_CONFIGURED"
          echo "No WIF provider is configured for this repository."
          echo "No Google credential exchange was attempted."
          echo "No external resource was modified."
          exit 1

      - name: Fail closed on incomplete federation configuration
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER != '' && vars.AUREA_GCP_SERVICE_ACCOUNT == '' }}
        run: |
          set -euo pipefail
          echo "GCP_WIF_CONFIGURATION_INCOMPLETE"
          echo "WIF provider exists but no service account is configured."
          echo "No Google resource was modified."
          exit 1

      - name: Authenticate to Google Cloud through WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AUREA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Verify real Google authentication
        run: |
          set -euo pipefail
          echo "=== REAL GCP AUTHENTICATION SUCCEEDED ==="
          gcloud auth list --filter=status:ACTIVE --format='table(account,status)'
          token="$(gcloud auth application-default print-access-token)"
          test -n "$token"
          echo "Credential exchange: PASS"

      - name: Verify Drive access, exact root, read-only capability, and index scope
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ.get("DRIVE_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("NO_DRIVE_ACCESS_TOKEN_FROM_AUTH_ACTION")

          root_id = os.environ["AUREA_KNOWLEDGE_OS_ROOT_ID"]
          index_id = os.environ["AUREA_KNOWLEDGE_OS_INDEX_ID"]
          headers = {"Authorization": f"Bearer {token}"}

          def get_file(file_id, fields):
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}?fields={fields}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"DRIVE_READ_FAILED_HTTP_{exc.code}: {file_id}")
                  print("DRIVE_ERROR_BODY_BEGIN")
                  print(body)
                  print("DRIVE_ERROR_BODY_END")
                  raise

          root = get_file(
              root_id,
              "id,name,mimeType,parents,capabilities(canEdit,canDownload,canCopy)"
          )

          if root.get("id") != root_id:
              raise SystemExit("KNOWLEDGE_OS_ROOT_ID_MISMATCH")
          if root.get("mimeType") != "application/vnd.google-apps.folder":
              raise SystemExit("KNOWLEDGE_OS_ROOT_NOT_FOLDER")
          if root.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("KNOWLEDGE_OS_ROOT_WRITE_CAPABILITY_NOT_DENIED")

          index = get_file(
              index_id,
              "id,name,mimeType,parents,version,modifiedTime,capabilities(canEdit,canDownload,canCopy)"
          )
          if index.get("id") != index_id:
              raise SystemExit("KNOWLEDGE_OS_INDEX_ID_MISMATCH")
          if index.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("KNOWLEDGE_OS_INDEX_WRITE_CAPABILITY_NOT_DENIED")

          index_parents = index.get("parents") or []
          if len(index_parents) != 1:
              raise SystemExit(f"KNOWLEDGE_OS_INDEX_PARENT_CHAIN_INVALID: {index_parents}")

          control_id = index_parents[0]
          control = get_file(
              control_id,
              "id,name,mimeType,parents,capabilities(canEdit,canDownload,canCopy)"
          )
          if control.get("mimeType") != "application/vnd.google-apps.folder":
              raise SystemExit("KNOWLEDGE_OS_CONTROL_NOT_FOLDER")
          if root_id not in (control.get("parents") or []):
              raise SystemExit("KNOWLEDGE_OS_INDEX_OUTSIDE_ROOT")
          if control.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("KNOWLEDGE_OS_CONTROL_WRITE_CAPABILITY_NOT_DENIED")

          print(json.dumps({
              "root": root,
              "index": index,
          }, indent=2))
          print("KNOWLEDGE_OS_ROOT_READ: PASS")
          print("KNOWLEDGE_OS_INDEX_METADATA_READ: PASS")
          print("KNOWLEDGE_OS_SCOPE_CHECK: PASS")
          print("KNOWLEDGE_OS_WRITE_CAPABILITY_CHECK: PASS")
          print("Next gate: read index content and verify institutional provenance from the observed payload")
          PY

      - name: Read real Knowledge OS v011 index content
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request

          token = os.environ.get("DRIVE_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("NO_DRIVE_ACCESS_TOKEN_FROM_AUTH_ACTION")

          index_id = os.environ["AUREA_KNOWLEDGE_OS_INDEX_ID"]
          url = f"https://www.googleapis.com/drive/v3/files/{index_id}?alt=media"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  content_type = response.headers.get("Content-Type", "")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"KNOWLEDGE_OS_CONTENT_READ_FAILED_HTTP_{exc.code}")
              print(body)
              raise

          if not raw:
              raise SystemExit("KNOWLEDGE_OS_INDEX_CONTENT_EMPTY")

          digest = hashlib.sha256(raw).hexdigest()
          try:
              payload = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"KNOWLEDGE_OS_INDEX_NOT_VALID_JSON: {exc}") from exc

          if not isinstance(payload, dict):
              raise SystemExit("KNOWLEDGE_OS_INDEX_TOP_LEVEL_NOT_OBJECT")

          keys = sorted(payload.keys())
          print(f"KNOWLEDGE_OS_INDEX_CONTENT_BYTES: {len(raw)}")
          print(f"KNOWLEDGE_OS_INDEX_CONTENT_TYPE: {content_type}")
          print(f"KNOWLEDGE_OS_INDEX_SHA256: {digest}")
          print(f"KNOWLEDGE_OS_INDEX_TOP_LEVEL_KEYS: {json.dumps(keys, ensure_ascii=False)}")

          def shape(value, path="$", depth=0, max_depth=4):
              if depth > max_depth:
                  return
              if isinstance(value, dict):
                  print(f"V011_SHAPE {path}: object keys={json.dumps(sorted(value.keys()), ensure_ascii=False)}")
                  for key in sorted(value.keys()):
                      shape(value[key], f"{path}.{key}", depth + 1, max_depth)
              elif isinstance(value, list):
                  print(f"V011_SHAPE {path}: array length={len(value)}")
                  if value:
                      shape(value[0], f"{path}[0]", depth + 1, max_depth)
              else:
                  print(f"V011_SHAPE {path}: {type(value).__name__}")

          print("=== V011 STRUCTURAL SHAPE (NO VALUES) ===")
          shape(payload)
          print("=== END V011 STRUCTURAL SHAPE ===")

          # Safe authority metadata needed to bind the concrete reader.
          # Do not print descriptions, titles, document contents, or arbitrary payload values.
          previous = payload.get("indice_anterior") or {}
          records = payload.get("registros_nuevos_v011") or []
          projects = sorted({
              str(item.get("proyecto"))
              for item in records
              if isinstance(item, dict) and item.get("proyecto")
          })
          states = sorted({
              str(item.get("estado"))
              for item in records
              if isinstance(item, dict) and item.get("estado")
          })
          print("=== V011 AUTHORITY METADATA ===")
          print(f"V011_VERSION: {payload.get('version_indice')}")
          print(f"V011_STATE: {payload.get('estado_indice')}")
          print(f"V011_PREVIOUS_INDEX_ID_PRESENT: {bool(previous.get('fileId'))}")
          print(f"V011_PREVIOUS_INDEX_ID: {previous.get('fileId') if previous.get('fileId') else 'NONE'}")
          print(f"V011_TOTAL_RECORDS_DECLARED: {payload.get('total_registros')}")
          print(f"V011_NEW_RECORDS_COUNT: {len(records)}")
          print(f"V011_RECORD_PROJECT_IDS: {json.dumps(projects, ensure_ascii=False)}")
          print(f"V011_RECORD_STATES: {json.dumps(states, ensure_ascii=False)}")
          print("=== END V011 AUTHORITY METADATA ===")

          print("KNOWLEDGE_OS_V011_CONTENT_READ: PASS")
          print("V011_CONTENT_PROBE: PASS")
          print("Next gate: execute the concrete InstitutionalAuthorityReader against the same live source.")
          PY

      - name: Diagnose live V011 record version shapes
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          token="$DRIVE_ACCESS_TOKEN"
          test -n "$token"
          raw="$(curl -fsS -H "Authorization: Bearer $token" "https://www.googleapis.com/drive/v3/files/$AUREA_KNOWLEDGE_OS_INDEX_ID?alt=media")"
          printf '%s' "$raw" | python -c 'import json,sys; p=json.load(sys.stdin); records=p.get("registros_nuevos_v011") or []; print("=== LIVE V011 RECORD VERSION SHAPES ==="); [print(f"record[{i}].version type={type(item.get("version")).__name__} value={json.dumps(item.get("version"), ensure_ascii=False)}") for i,item in enumerate(records) if isinstance(item,dict)]; print("=== END LIVE V011 RECORD VERSION SHAPES ===")'


      - name: Prepare live institutional reader test scope
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          token="$DRIVE_ACCESS_TOKEN"
          test -n "$token"
          echo "::add-mask::$token"
          raw="$(curl -fsS -H "Authorization: Bearer $token" "https://www.googleapis.com/drive/v3/files/$AUREA_KNOWLEDGE_OS_INDEX_ID?alt=media")"
          project_id="$(python -c 'import json,sys; p=json.load(sys.stdin); r=p.get("registros_nuevos_v011") or []; print((r[0].get("proyecto") if r and isinstance(r[0],dict) else "") or "")' <<< "$raw")"
          test -n "$project_id"
          echo "AUREA_LIVE_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "LIVE_READER_PROJECT_SCOPE: PRESENT"

      - name: Setup Node for live institutional reader
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AUREA runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Execute concrete live InstitutionalAuthorityReader
        env:
          AUREA_LIVE_DRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
          AUREA_KNOWLEDGE_OS_INDEX_ID: ${{ env.AUREA_KNOWLEDGE_OS_INDEX_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$AUREA_LIVE_DRIVE_TOKEN"
          npx vitest run src/context/google-drive-institutional-reader.live.test.ts
          echo "BIBLIOTECARIO_LIVE_READER: PASS"
