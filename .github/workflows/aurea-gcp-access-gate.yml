name: AUREA GCP Access Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main


permissions:
  contents: read
  id-token: write

env:
  AUREA_KNOWLEDGE_OS_ROOT_ID: 1LII_NQoow-zcR_iGECRiA6cVS4VOBXLm
  AUREA_KNOWLEDGE_OS_INDEX_ID: 1kIzswJSMKzQOpf8z6j8iDvfxhq26ZvXa

jobs:
  gcp-access-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore: execute aurea gcp access gate' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report configured GCP federation inputs
        env:
          WIF_PROVIDER: ${{ vars.AUREA_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "=== AUREA GCP ACCESS GATE ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "OIDC permission: id-token=write"
          if [ -n "$WIF_PROVIDER" ]; then echo "WIF provider variable: PRESENT"; else echo "WIF provider variable: MISSING"; fi
          if [ -n "$SERVICE_ACCOUNT" ]; then echo "Service account variable: PRESENT"; else echo "Service account variable: MISSING"; fi

      - name: Fail closed when WIF federation is not configured
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER == '' }}
        run: |
          set -euo pipefail
          echo "GCP_CONTROL_PLANE_NOT_CONFIGURED"
          echo "No WIF provider is configured for this repository."
          echo "No Google credential exchange was attempted."
          echo "No external resource was modified."
          exit 1

      - name: Fail closed on incomplete federation configuration
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER != '' && vars.AUREA_GCP_SERVICE_ACCOUNT == '' }}
        run: |
          set -euo pipefail
          echo "GCP_WIF_CONFIGURATION_INCOMPLETE"
          echo "WIF provider exists but no service account is configured."
          echo "No Google resource was modified."
          exit 1

      - name: Authenticate to Google Cloud through WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AUREA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Verify real Google authentication
        run: |
          set -euo pipefail
          echo "=== REAL GCP AUTHENTICATION SUCCEEDED ==="
          gcloud auth list --filter=status:ACTIVE --format='table(account,status)'
          token="$(gcloud auth application-default print-access-token)"
          test -n "$token"
          echo "Credential exchange: PASS"

      - name: Verify Drive access, exact root, read-only capability, and index scope
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ.get("DRIVE_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("NO_DRIVE_ACCESS_TOKEN_FROM_AUTH_ACTION")

          root_id = os.environ["AUREA_KNOWLEDGE_OS_ROOT_ID"]
          index_id = os.environ["AUREA_KNOWLEDGE_OS_INDEX_ID"]
          headers = {"Authorization": f"Bearer {token}"}

          def get_file(file_id, fields):
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}?fields={fields}"
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"DRIVE_READ_FAILED_HTTP_{exc.code}: {file_id}")
                  print("DRIVE_ERROR_BODY_BEGIN")
                  print(body)
                  print("DRIVE_ERROR_BODY_END")
                  raise

          root = get_file(
              root_id,
              "id,name,mimeType,parents,capabilities(canEdit,canDownload,canCopy)"
          )
          if root.get("id") != root_id:
              raise SystemExit("KNOWLEDGE_OS_ROOT_ID_MISMATCH")
          if root.get("mimeType") != "application/vnd.google-apps.folder":
              raise SystemExit("KNOWLEDGE_OS_ROOT_NOT_FOLDER")
          if root.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("KNOWLEDGE_OS_ROOT_WRITE_CAPABILITY_NOT_DENIED")

          index = get_file(
              index_id,
              "id,name,mimeType,parents,version,modifiedTime,capabilities(canEdit,canDownload,canCopy)"
          )
          if index.get("id") != index_id:
              raise SystemExit("KNOWLEDGE_OS_INDEX_ID_MISMATCH")
          if root_id not in (index.get("parents") or []):
              raise SystemExit("KNOWLEDGE_OS_INDEX_OUTSIDE_ROOT")
          if index.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("KNOWLEDGE_OS_INDEX_WRITE_CAPABILITY_NOT_DENIED")

          print(json.dumps({
              "root": root,
              "index": index,
          }, indent=2))
          print("KNOWLEDGE_OS_ROOT_READ: PASS")
          print("KNOWLEDGE_OS_INDEX_METADATA_READ: PASS")
          print("KNOWLEDGE_OS_SCOPE_CHECK: PASS")
          print("KNOWLEDGE_OS_WRITE_CAPABILITY_CHECK: PASS")
          print("Next gate: read index content, verify institutional provenance, then prove write denial with a non-destructive request")
          PY

      - name: Read real Knowledge OS v011 index content
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request

          token = os.environ.get("DRIVE_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("NO_DRIVE_ACCESS_TOKEN_FROM_AUTH_ACTION")

          index_id = os.environ["AUREA_KNOWLEDGE_OS_INDEX_ID"]
          url = f"https://www.googleapis.com/drive/v3/files/{index_id}?alt=media"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  content_type = response.headers.get("Content-Type", "")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"KNOWLEDGE_OS_CONTENT_READ_FAILED_HTTP_{exc.code}")
              print(body)
              raise

          if not raw:
              raise SystemExit("KNOWLEDGE_OS_INDEX_CONTENT_EMPTY")

          digest = hashlib.sha256(raw).hexdigest()
          try:
              payload = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"KNOWLEDGE_OS_INDEX_NOT_VALID_JSON: {exc}") from exc

          if not isinstance(payload, dict):
              raise SystemExit("KNOWLEDGE_OS_INDEX_TOP_LEVEL_NOT_OBJECT")

          keys = sorted(payload.keys())
          print(f"KNOWLEDGE_OS_INDEX_CONTENT_BYTES: {len(raw)}")
          print(f"KNOWLEDGE_OS_INDEX_CONTENT_TYPE: {content_type}")
          print(f"KNOWLEDGE_OS_INDEX_SHA256: {digest}")
          print(f"KNOWLEDGE_OS_INDEX_TOP_LEVEL_KEYS: {json.dumps(keys, ensure_ascii=False)}")
          print("KNOWLEDGE_OS_V011_CONTENT_READ: PASS")
          print("V011_CONTENT_PROBE: PASS")
          print("Institutional provenance remains a separate verification gate until the observed payload fields are reviewed.")
          PY
