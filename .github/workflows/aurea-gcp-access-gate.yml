name: AUREA GCP Access Gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AUREA_KNOWLEDGE_OS_ROOT_ID: 1LII_NQoow-zcR_iGECRiA6cVS4VOBXLm
  AUREA_KNOWLEDGE_OS_INDEX_ID: 19YHMHdlpD-yKA1HK-zyUszVzDhNldkHx

jobs:
  gcp-access-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report configured GCP federation inputs
        env:
          WIF_PROVIDER: ${{ vars.AUREA_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "=== AUREA GCP ACCESS GATE ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "OIDC permission: id-token=write"
          if [ -n "$WIF_PROVIDER" ]; then echo "WIF provider variable: PRESENT"; else echo "WIF provider variable: MISSING"; fi
          if [ -n "$SERVICE_ACCOUNT" ]; then echo "Service account variable: PRESENT"; else echo "Service account variable: MISSING"; fi

      - name: Stop safely when GCP federation is not configured
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER == '' }}
        run: |
          echo "GCP_CONTROL_PLANE_NOT_CONFIGURED"
          echo "No WIF provider is configured for this repository."
          echo "No Google credential exchange was attempted."
          echo "No external resource was modified."
          exit 0

      - name: Fail closed on incomplete federation configuration
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER != '' && vars.AUREA_GCP_SERVICE_ACCOUNT == '' }}
        run: |
          echo "GCP_WIF_CONFIGURATION_INCOMPLETE"
          echo "WIF provider exists but no service account is configured."
          echo "No Google resource was modified."
          exit 1

      - name: Authenticate to Google Cloud through WIF
        if: ${{ vars.AUREA_GCP_WIF_PROVIDER != '' && vars.AUREA_GCP_SERVICE_ACCOUNT != '' }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AUREA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Verify real Google authentication
        if: ${{ steps.auth.outcome == 'success' }}
        run: |
          set -euo pipefail
          echo "=== REAL GCP AUTHENTICATION SUCCEEDED ==="
          gcloud auth list --filter=status:ACTIVE --format='table(account,status)'
          echo "Credential exchange: PASS"

      - name: Verify Drive API access to the Knowledge OS root
        if: ${{ steps.auth.outcome == 'success' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request
          token = subprocess.check_output(["gcloud", "auth", "application-default", "print-access-token"], text=True).strip()
          if not token:
              raise SystemExit("NO_ACCESS_TOKEN")
          file_id = os.environ["AUREA_KNOWLEDGE_OS_ROOT_ID"]
          req = urllib.request.Request(
              f"https://www.googleapis.com/drive/v3/files/{file_id}?fields=id,name,mimeType,capabilities(canEdit,canDownload,canCopy)",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"DRIVE_READ_FAILED_HTTP_{exc.code}")
              raise
          safe = {k: data.get(k) for k in ("id", "name", "mimeType", "capabilities")}
          print(json.dumps(safe, indent=2))
          if data.get("id") != file_id:
              raise SystemExit("KNOWLEDGE_OS_ROOT_ID_MISMATCH")
          print("KNOWLEDGE_OS_ROOT_READ: PASS")
          print("Next gate: read INDICE_MAESTRO_v010.json and prove write denial")
