name: SP Examenes Pilot Health Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sp-examenes-live-smoke.yml'
      - 'apps/sp-examenes/worker.ts'
      - 'apps/sp-examenes/evidence-gate.ts'
      - 'apps/sp-examenes/public/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check deployed pilot health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://sp-examenes-pilot.carlosasantoss73.workers.dev/health \
            -o /tmp/health.json
          cat /tmp/health.json
          jq -e '.status == "ok" and .app == "SP-EXAMENES"' /tmp/health.json >/dev/null
