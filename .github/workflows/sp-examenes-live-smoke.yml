name: SP Examenes Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sp-examenes-live-smoke.yml'
      - 'apps/sp-examenes/worker.ts'
      - 'apps/sp-examenes/public/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://sp-examenes-pilot.carlosasantoss73.workers.dev/health \
            -o /tmp/health.json
          cat /tmp/health.json
          jq -e '.status == "ok" and .app == "SP-EXAMENES"' /tmp/health.json >/dev/null
      - name: Submit one controlled text question and measure latency
        run: |
          set -euo pipefail
          payload='{"question":"Un oferente olvidó incluir o referenciar el manual de fábrica en su oferta para un proceso de adquisición de equipos de sonido. ¿Cómo se clasifica esta omisión?","image":null,"mimeType":null}'
          code="$(curl --silent --show-error --max-time 110 \
            -H 'content-type: application/json' \
            -X POST --data "$payload" -o /tmp/text-answer.json \
            -w '%{http_code}' \
            https://sp-examenes-pilot.carlosasantoss73.workers.dev/api/answer)"
          echo "Text HTTP status: $code"
          jq -c '{error,sourceStatus,answer:(.answer // null),sourcesCount:(.sources | length),latencyMs}' /tmp/text-answer.json
          test "$code" = "200"
          jq -e '(.answer | type == "string") and (.answer | length > 0)' /tmp/text-answer.json >/dev/null
      - name: Submit image input smoke test
        run: |
          set -euo pipefail
          # Fixture RGB PNG 2×2: checks payload handling only; OCR needs a separate visual fixture.
          image_b64='iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAFklEQVR4nGNUSDjAwMDAxMDAwMDAAAAOigFEqspbYAAAAABJRU5ErkJggg=='
          printf '%s' "$image_b64" | base64 --decode > /tmp/sp-examenes-smoke.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path("/tmp/sp-examenes-smoke.png").read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "fixture is not PNG"
          width, height, bit_depth, color_type = struct.unpack(">IIBB", data[16:26])
          assert (width, height, bit_depth, color_type) == (2, 2, 8, 2), "unexpected smoke-image format"
          PY
          payload="$(jq -cn --arg question "Responde brevemente a esta pregunta de práctica: ¿qué información debe verificar una entidad antes de clasificar una omisión documental?" --arg image "$image_b64" '{question:$question,image:$image,mimeType:"image/png}')"
          code="$(curl --silent --show-error --max-time 110 \
            -H 'content-type: application/json' \
            -X POST --data "$payload" -o /tmp/image-answer.json \
            -w '%{http_code}' \
            https://sp-examenes-pilot.carlosasantoss73.workers.dev/api/answer)"
          echo "Image HTTP status: $code"
          jq -c '{error,sourceStatus,answer:(.answer // null),sourcesCount:(.sources | length),latencyMs}' /tmp/image-answer.json
          test "$code" = "200"
          jq -e '(.answer | type == "string") and (.answer | length > 0)' /tmp/image-answer.json >/dev/null
