name: A2A Live Interoperability

on:
  # The external interoperability endpoint is currently blocked by HTTP 404.
  # Keep this live gate manual until a verified endpoint is configured.
  workflow_dispatch:

jobs:
  live-a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Execute live A2A interoperability test
        env:
          AUREA_LIVE_A2A: "1"
        run: npm test -- --run tests/aurea-a2a-live.interop.test.ts
