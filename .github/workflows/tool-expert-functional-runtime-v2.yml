name: Tool Expert Functional Runtime V2

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/tool_expert_factory/functional_runtime_mcp.py"
      - "apps/tool_expert_factory/functional_runtime_stagehand.mjs"
      - ".github/workflows/tool-expert-functional-runtime-v2.yml"
  pull_request:
    paths:
      - "apps/tool_expert_factory/functional_runtime_mcp.py"
      - "apps/tool_expert_factory/functional_runtime_stagehand.mjs"
      - ".github/workflows/tool-expert-functional-runtime-v2.yml"

jobs:
  playwright-mcp-runtime:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MCP client
        run: python -m pip install "mcp>=2.1.1"
      - name: Run Playwright MCP functional smoke
        run: python apps/tool_expert_factory/functional_runtime_mcp.py

  stagehand-runtime:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stagehand
        run: npm install --no-save @browserbasehq/stagehand zod
      - name: Run Stagehand functional smoke
        run: node apps/tool_expert_factory/functional_runtime_stagehand.mjs
