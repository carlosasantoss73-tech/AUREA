name: Tool Expert Functional Runtime Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/tool_expert_factory/functional_runtime_smoke.py"
      - ".github/workflows/tool-expert-functional-runtime-smoke.yml"

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ENABLE_GEMINI: "true"
      LLM_KEY: "GEMINI_3.0_FLASH"
      SECONDARY_LLM_KEY: "GEMINI_3.0_FLASH"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install browser-use "skyvern[local]"
      - run: python -m playwright install chromium
      - name: Execute harmless runtime task
        run: python apps/tool_expert_factory/functional_runtime_smoke.py
