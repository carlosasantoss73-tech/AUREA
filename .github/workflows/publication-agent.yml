name: AUREA Publication Agent

on:
  push:
    paths:
      - "apps/publication-agent/**"
      - ".github/workflows/publication-agent.yml"
  pull_request:
    paths:
      - "apps/publication-agent/**"
      - ".github/workflows/publication-agent.yml"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/publication-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run deterministic safety tests
        run: python -m pytest -q
