name: SP Examenes Pilot Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/sp-examenes/**'
      - '.github/workflows/sp-examenes-pilot-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sp-examenes-pilot-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/sp-examenes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app files
        run: |
          test -s worker.ts
          test -s public/index.html
          test -s wrangler.jsonc
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing one of CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or GEMINI_API_KEY in GitHub Actions secrets."
            exit 1
          fi
      - name: Verify Cloudflare account scope
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)"
          success="$(printf '%s' "$response" | jq -r '.success // false')"
          if [ "$success" != "true" ]; then
            echo "::error::Cloudflare token cannot list accessible accounts; inspect token scopes and account configuration."
            printf '%s' "$response" | jq -r '.errors[]? | "Cloudflare API error code=\(.code) message=\(.message)"'
            exit 1
          fi
          match_count="$(printf '%s' "$response" | jq --arg id "$CLOUDFLARE_ACCOUNT_ID" '[.result[]? | select(.id == $id)] | length')"
          if [ "$match_count" = "0" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not match an account accessible to this token. Available account IDs and names:"
            printf '%s' "$response" | jq -r '.result[]? | "\(.id)  \(.name)"'
            exit 1
          fi
          matched_name="$(printf '%s' "$response" | jq -r --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result[]? | select(.id == $id) | .name' | head -n 1)"
          echo "Cloudflare account identifier validated; matched account name: $matched_name"
      - name: Deploy Worker and static UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Set Gemini runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config wrangler.jsonc
