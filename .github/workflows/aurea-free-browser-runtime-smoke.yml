name: AUREA Free Browser Runtime Smoke

on:
  push:
    branches:
      - feat/browser-use-runtime-integration-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install --quiet mcp
      - name: Run free Playwright MCP functional smoke
        run: python apps/tool_expert_factory/functional_runtime_mcp.py
