name: AUREA Controlled Live Provider Fallback Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "test/live-provider-fallback-smoke"
  pull_request:
    branches:
      - "main"

jobs:
  live-provider-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gemini SDK
        run: python -m pip install -r apps/gemini-expert/requirements.txt
      - name: Execute controlled live fallback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_PRIMARY_MODEL: "aurea-invalid-model-for-fallback-smoke"
          AUREA_GEMINI_MODEL: ${{ vars.AUREA_GEMINI_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "LIVE_PROVIDER_FALLBACK_BLOCKED: OPENAI_API_KEY is not configured."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "LIVE_PROVIDER_FALLBACK_BLOCKED: GEMINI_API_KEY is not configured."
            exit 1
          fi
          python apps/tool_expert_factory/live_provider_fallback_smoke.py
