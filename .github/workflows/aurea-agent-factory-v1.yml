name: aurea-agent-factory-v1

on:
  push:
    branches:
      - "feat/aurea-agent-factory-v1"
      - "feat/aurea-procurement-v1"
  pull_request:
    branches:
      - "feat/aurea-agent-factory-v1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
