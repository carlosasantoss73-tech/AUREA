name: A2A Living Platform Live Consultation

on:
  push:
    branches:
      - feat/a2a-living-platform-live
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  live-a2a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Execute live A2A consultation
        run: npm test -- --run tests/aurea-a2a-live.interop.test.ts
