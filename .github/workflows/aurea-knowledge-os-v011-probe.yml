name: AUREA Knowledge OS v011 Live Reader Probe

on:
  push:
    branches:
      - feat/browser-use-runtime-integration-v1
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/aurea-knowledge-os-v011-probe.yml'
      - 'src/context/**'
      - 'apps/tool_expert_factory/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AUREA_KNOWLEDGE_OS_ROOT_ID: 1LII_NQoow-zcR_iGECRiA6cVS4VOBXLm
  AUREA_KNOWLEDGE_OS_INDEX_ID: 1kIzswJSMKzQOpf8z6j8iDvfxhq26ZvXa

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight required GCP WIF configuration
        id: wif_gate
        env:
          WIF_PROVIDER: ${{ vars.AUREA_GCP_WIF_PROVIDER || secrets.AUREA_GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT || secrets.AUREA_GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "BIBLIOTECARIO_STATUS: SKIPPED_EXTERNAL_CONFIGURATION"
            echo "BIBLIOTECARIO_BLOCKER: WIF provider/service account is not configured."
            echo "POLICY: no credential fabrication; no local fallback for institutional authority."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'; then
            echo "BIBLIOTECARIO_BLOCKER: AUREA_GCP_WIF_PROVIDER has an invalid resource format."
            exit 1
          fi
          if ! printf '%s' "$SERVICE_ACCOUNT" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.iam\.gserviceaccount\.com$'; then
            echo "BIBLIOTECARIO_BLOCKER: AUREA_GCP_SERVICE_ACCOUNT has an invalid service-account email format."
            exit 1
          fi
          echo "GCP_WIF_CONFIGURATION: PRESENT_AND_FORMAT_VALID"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud through WIF
        id: auth
        if: steps.wif_gate.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AUREA_GCP_WIF_PROVIDER || secrets.AUREA_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.AUREA_GCP_SERVICE_ACCOUNT || secrets.AUREA_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Install Google API client
        if: steps.wif_gate.outputs.configured == 'true'
        run: python -m pip install --quiet google-api-python-client google-auth


      - name: Discover authoritative index candidates and reusable agent documents
        if: steps.wif_gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from googleapiclient.discovery import build
          drive = build("drive", "v3")
          queries = [
              "name contains 'INDICE_MAESTRO' and trashed = false",
              "name contains 'BIBLIOTECARIO_IA_AUREA_UNIVERSAL' and trashed = false",
              "name contains 'PROTOCOLO_OPERATIVO_v2' and trashed = false",
              "name contains 'MANUAL_CONEXION_MULTI_IA_v2' and trashed = false",
              "name contains 'MANUAL_INSTALACION_v2' and trashed = false",
          ]
          all_files = {}
          for query in queries:
              token = None
              while True:
                  result = drive.files().list(
                      q=query, pageSize=1000, pageToken=token,
                      orderBy="name",
                      fields="nextPageToken,files(id,name,mimeType,modifiedTime,parents,capabilities(canEdit))",
                      includeItemsFromAllDrives=True, supportsAllDrives=True
                  ).execute()
                  for item in result.get("files", []):
                      all_files[item["id"]] = item
                  token = result.get("nextPageToken")
                  if not token:
                      break
          print(f"KNOWLEDGE_OS_REUSABLE_CANDIDATE_COUNT: {len(all_files)}")
          print("=== INDEX / BIBLIOTECARIO / PROTOCOL CANDIDATES (METADATA ONLY) ===")
          print(json.dumps(sorted(all_files.values(), key=lambda x: x.get("name", "")), indent=2, ensure_ascii=False))
          print("DISCOVERY_COMPLETE: PASS")
          PY

      - name: Read exact institutional v011 index content
        if: steps.wif_gate.outputs.configured == 'true'
        env:
          INDEX_ID: ${{ env.AUREA_KNOWLEDGE_OS_INDEX_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          def download_text(drive, file_id):
              request = drive.files().get_media(fileId=file_id)
              buffer = io.BytesIO()
              downloader = MediaIoBaseDownload(buffer, request)
              done = False
              while not done:
                  _, done = downloader.next_chunk()
              return buffer.getvalue().decode("utf-8")

          index_id = os.environ["INDEX_ID"]
          drive = build("drive", "v3")

          meta = drive.files().get(
              fileId=index_id,
              fields="id,name,mimeType,parents,modifiedTime,version,capabilities(canEdit,canDownload,canCopy),shortcutDetails(targetId,targetMimeType)"
          ).execute()

          print("=== V011 METADATA ===")
          print(json.dumps(meta, indent=2))

          if meta["id"] != index_id:
              raise SystemExit("KNOWLEDGE_OS_INDEX_ID_MISMATCH")
          if meta.get("capabilities", {}).get("canEdit") is not False:
              raise SystemExit("KNOWLEDGE_OS_INDEX_WRITE_CAPABILITY_NOT_DENIED")

          raw = download_text(drive, index_id)

          digest = hashlib.sha256(raw.encode("utf-8")).hexdigest()
          print(f"V011_CONTENT_SHA256: {digest}")
          print(f"V011_CONTENT_BYTES: {len(raw.encode('utf-8'))}")

          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"V011_NOT_JSON:{exc}")

          print("=== V011 TOP LEVEL SHAPE ===")
          if isinstance(parsed, dict):
              print(f"OBJECT_KEYS_COUNT: {len(parsed)}")
              print("OBJECT_KEYS: " + ",".join(sorted(parsed.keys())))
          elif isinstance(parsed, list):
              print(f"LIST_LENGTH: {len(parsed)}")
          else:
              print(f"ROOT_TYPE: {type(parsed).__name__}")

          print("=== V007 AUTHORITATIVE CANDIDATE CHECK ===")
          v007_id = "1K9cWDYsTBr9ctkh6rnr-vONy8yFGnoGY"
          v007_meta = drive.files().get(
              fileId=v007_id,
              fields="id,name,mimeType,parents,modifiedTime,version,capabilities(canEdit,canDownload,canCopy),shortcutDetails(targetId,targetMimeType)"
          ).execute()
          print(json.dumps(v007_meta, indent=2))
          v007_raw = download_text(drive, v007_id)
          print(f"V007_CONTENT_BYTES: {len(v007_raw.encode('utf-8'))}")
          try:
              v007 = json.loads(v007_raw)
              print("V007_TOP_LEVEL_KEYS: " + ",".join(sorted(v007.keys())) if isinstance(v007, dict) else f"V007_ROOT_TYPE: {type(v007).__name__}")
              if isinstance(v007, dict):
                  print(f"V007_REGISTROS_COUNT: {len(v007.get('registros', []))}")
                  print(f"V007_VERSION: {v007.get('version', v007.get('version_indice', 'NOT_EXPLICIT'))}")
          except json.JSONDecodeError as exc:
              print(f"V007_NOT_JSON: {exc}")
          print("V007_CANDIDATE_CHECK: COMPLETE")


          if isinstance(parsed, dict):
              print(f"V011_VERSION: {parsed.get('version_indice', 'NOT_EXPLICIT')}")
              print(f"V011_STATE: {parsed.get('estado_indice', 'NOT_EXPLICIT')}")
              print(f"V011_TOTAL_REGISTROS: {parsed.get('total_registros', 'NOT_EXPLICIT')}")
              print(f"V011_NEW_RECORDS_COUNT: {len(parsed.get('registros_nuevos_v011', []))}")
              print(f"V011_PREVIOUS_INDEX_REF: {parsed.get('indice_anterior', 'NOT_EXPLICIT')}")
              print(f"V011_INDEX_FIELD_TYPE: {type(parsed.get('indice')).__name__}")
              new_records = parsed.get("registros_nuevos_v011", [])
              print("=== V011 NEW RECORD METADATA ===")
              print(json.dumps([
                  {k: item.get(k) for k in ("id", "nombre", "proyecto", "estado", "categoria", "version")}
                  for item in new_records if isinstance(item, dict)
              ], indent=2, ensure_ascii=False))


          print("=== V011 VERSION-CHAIN SUMMARY ===")
          cursor_id = index_id
          seen_index_ids = set()
          indexed_records = {}
          chain_summary = []
          while cursor_id and cursor_id not in seen_index_ids:
              seen_index_ids.add(cursor_id)
              version_meta = drive.files().get(
                  fileId=cursor_id,
                  fields="id,name,modifiedTime,capabilities(canEdit)"
              ).execute()
              version_raw = download_text(drive, cursor_id)
              try:
                  version_data = json.loads(version_raw)
              except json.JSONDecodeError:
                  print(f"INDEX_CHAIN_INVALID_JSON: {cursor_id}")
                  break
              record_lists = []
              if isinstance(version_data, dict):
                  if isinstance(version_data.get("registros"), list):
                      record_lists.append(version_data["registros"])
                  for key, value in version_data.items():
                      if key.startswith("registros_nuevos") and isinstance(value, list):
                          record_lists.append(value)
                  local_count = sum(len(items) for items in record_lists)
                  chain_summary.append({
                      "fileId": cursor_id,
                      "name": version_meta.get("name"),
                      "version": version_data.get("version_indice"),
                      "state": version_data.get("estado_indice"),
                      "declaredTotal": version_data.get("total_registros"),
                      "recordsInLists": local_count,
                  })
                  for items in record_lists:
                      for item in items:
                          if isinstance(item, dict) and item.get("id"):
                              indexed_records[item["id"]] = item
                  previous = version_data.get("indice_anterior")
                  cursor_id = previous.get("fileId") if isinstance(previous, dict) else None
              else:
                  break
          print("INDEX_CHAIN: " + json.dumps(chain_summary, ensure_ascii=False))
          print(f"INDEX_CHAIN_UNIQUE_RECORD_IDS: {len(indexed_records)}")
          print("=== ECP / REUSABLE AGENT RECORD MATCHES ===")
          matches = [
              {k: item.get(k) for k in ("id", "nombre", "proyecto", "estado", "categoria", "version", "componente_reutilizable", "ubicacion")}
              for item in indexed_records.values()
              if "ECP" in str(item).upper()
              or "CONTRATACION PUBLICA" in str(item).upper()
              or item.get("id") in {"AKL-002", "AKL-031", "AKL-034", "AKL-035"}
          ]
          print(json.dumps(matches, indent=2, ensure_ascii=False))
          print("VERSION_CHAIN_READ_ONLY: PASS")

          print("V011_CONTENT_PROBE: PASS")
          PY

      - name: Set explicit ECP project scope for live reader
        if: steps.wif_gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          echo "AUREA_LIVE_PROJECT_ID=ecp" >> "$GITHUB_ENV"
          echo "LIVE_READER_PROJECT_SCOPE: ecp (explicit target; no first-record inference)"

      - name: Setup Node for live institutional reader
        if: steps.wif_gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AUREA runtime dependencies
        if: steps.wif_gate.outputs.configured == 'true'
        run: npm install --no-audit --no-fund

      - name: Execute live ECP institutional reader and context gate
        if: steps.wif_gate.outputs.configured == 'true'
        env:
          AUREA_LIVE_DRIVE_TOKEN: ${{ steps.auth.outputs.access_token }}
          AUREA_KNOWLEDGE_OS_INDEX_ID: ${{ env.AUREA_KNOWLEDGE_OS_INDEX_ID }}
          AUREA_LIVE_PROJECT_ID: ecp
        run: |
          set -euo pipefail
          if [ -z "${AUREA_LIVE_DRIVE_TOKEN:-}" ]; then
            echo "BIBLIOTECARIO_LIVE_ECP_SCOPE_PROBE: BLOCKED_NO_ACCESS_TOKEN"
            exit 1
          fi
          echo "::add-mask::$AUREA_LIVE_DRIVE_TOKEN"
          output="$(npx vitest run src/context/google-drive-institutional-reader.live.test.ts 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          if grep -Eq '[0-9]+ skipped' <<< "$output"; then
            echo "BIBLIOTECARIO_LIVE_ECP_SCOPE_PROBE: BLOCKED_TESTS_SKIPPED"
            exit 1
          fi
          echo "BIBLIOTECARIO_LIVE_ECP_SCOPE_PROBE: PASS"
